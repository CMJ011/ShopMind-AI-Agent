<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopMind 智能客服</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#162D59',
                        primaryLight: '#254b99',
                        assist: '#2A9D8F',
                        warn: '#D64045',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .scrollbar-chat::-webkit-scrollbar { width:5px }
            .scrollbar-chat::-webkit-scrollbar-thumb { @apply bg-gray-300 rounded-full }
            .bubble-ai { @apply self-start bg-white border border-gray-100 p-3 rounded-xl rounded-tl-none max-w-[82%] shadow-sm text-sm }
            .bubble-user { @apply self-end bg-gradient-to-r from-primary to-primaryLight text-white p-3 rounded-xl rounded-tr-none max-w-[82%] shadow-sm text-sm }
            .bubble-manual { @apply self-start bg-amber-50 border border-amber-200 text-amber-800 p-3 rounded-xl rounded-tl-none max-w-[82%] shadow-sm text-sm }
            .dot-anim span { animation: dot 1.4s infinite ease-in-out both; }
            .dot-anim span:nth-child(1) { animation-delay: -0.32s; }
            .dot-anim span:nth-child(2) { animation-delay: -0.16s; }
            @keyframes dot {
                0%,80%,100% { transform: scale(0); opacity:0.4; }
                40% { transform: scale(1); opacity:1; }
            }
        }
    </style>
</head>
<!-- 🔥 修改点：body 设置为 h-screen 铺满全屏，无 padding -->
<body class="bg-slate-50 h-screen w-screen overflow-hidden flex flex-col">
    
    <!-- 🔥 修改点：移除外层包裹的 max-w-lg 和圆角，让内容撑满 -->
    <div class="w-full h-full flex flex-col bg-white">
        <!-- 顶部导航栏 -->
        <div class="bg-gradient-to-r from-primary to-primaryLight text-white p-4 flex justify-between items-center shadow-md z-10">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center">
                    <i class="fa fa-comments-o text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold">ShopMind 客服小满</h1>
                    <p class="text-xs text-blue-100">当前身份：用户 A · AI智能接待中</p>
                </div>
            </div>
            <button id="btnHuman" onclick="triggerHuman()" class="px-4 py-2 bg-white/15 hover:bg-white/25 rounded-lg text-sm transition">
                <i class="fa fa-user-circle-o mr-1"></i>转人工
            </button>
        </div>

        <!-- 消息聊天容器 -->
        <div id="chat-box" class="flex-1 p-6 overflow-y-auto scrollbar-chat bg-slate-50 flex flex-col gap-4">
            <!-- 默认问候 -->
            <div class="flex gap-3 items-start">
                <div class="w-9 h-9 shrink-0 rounded-full bg-assist text-white flex items-center justify-center">
                    <i class="fa fa-robot"></i>
                </div>
                <div class="bubble-ai">
                    <div>您好👋，我是智能客服小满，请问有订单、售后或者商品相关问题需要咨询？</div>
                </div>
            </div>
        </div>

        <!-- 输入区域 -->
        <div class="p-4 bg-white border-t border-gray-100 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-10">
            <div class="max-w-4xl mx-auto flex gap-3">
                <textarea id="msg-input" placeholder="请输入您的问题，回车发送..." rows="1"
                    class="flex-1 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-primary/40 resize-none transition"
                    onkeydown="if(event.key === 'Enter' && !event.shiftKey){ event.preventDefault(); sendMessage(); }"></textarea>
                <button onclick="sendMessage()" id="send-btn"
                    class="bg-primary text-white px-6 py-2 rounded-xl text-sm hover:bg-primaryLight transition-all active:scale-95 flex items-center gap-2">
                    <i class="fa fa-paper-plane"></i>
                    <span>发送</span>
                </button>
            </div>
            <div class="max-w-4xl mx-auto mt-2 text-[11px] text-gray-400 text-center">💡AI回答仅供参考，涉及售后可点击右上角转人工客服</div>
        </div>
    </div>

    <!-- 知识库引用弹窗 -->
    <div id="kbModal" class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50">
        <div class="bg-white w-[90%] max-w-md rounded-xl shadow-xl p-5">
            <div class="flex justify-between items-center mb-3">
                <h3 class="font-medium text-sm">📎知识库原文</h3>
                <button onclick="closeKbModal()" class="text-gray-400 hover:text-gray-600"><i class="fa fa-times"></i></button>
            </div>
            <div id="kbContent" class="text-sm text-gray-600 bg-gray-50 p-3 rounded-lg max-h-60 overflow-y-auto"></div>
        </div>
    </div>

    <script>
        const TOKEN = "tokenA";
        const SESSION_ID = "web_session_A";

        function showLoading() {
            const box = document.getElementById("chat-box");
            const wrap = document.createElement("div");
            wrap.id = "loadingWrap";
            wrap.className = "flex gap-3 items-start";
            wrap.innerHTML = `
                <div class="w-9 h-9 shrink-0 rounded-full bg-assist text-white flex items-center justify-center">
                    <i class="fa fa-robot"></i>
                </div>
                <div class="bubble-ai">
                    <div class="dot-anim flex gap-1">
                        <span class="w-2 h-2 bg-slate-400 rounded-full"></span>
                        <span class="w-2 h-2 bg-slate-400 rounded-full"></span>
                        <span class="w-2 h-2 bg-slate-400 rounded-full"></span>
                    </div>
                </div>
            `;
            box.appendChild(wrap);
            box.scrollTop = box.scrollHeight;
        }
        function hideLoading() {
            const el = document.getElementById("loadingWrap");
            if(el) el.remove();
        }

        function triggerHuman(){
            document.getElementById("msg-input").value = "转接人工客服";
            sendMessage();
        }

                async function sendMessage() {
            const input = document.getElementById("msg-input");
            const message = input.value.trim();
            if (!message) return;
            
            appendMessage("user", message);
            input.value = "";
            const btn = document.getElementById("send-btn");
            btn.disabled = true;
            showLoading();

            try {
                const response = await fetch("http://127.0.0.1:8000/api/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${TOKEN}`
                    },
                    body: JSON.stringify({ message: message, session_id: SESSION_ID })
                });
                
                if (response.status === 429) throw new Error("Rate Limited");
                if (!response.ok) throw new Error("请求失败");
                
                const data = await response.json();
                hideLoading();
                appendMessage("ai", data.reply, data.meta);

                // 🔥 核心联动：如果后端判断需要转人工，自动打开客服工作台
                if (data.meta && data.meta.plan === "handoff") {
                    // 延迟 500 毫秒打开，让用户先看到橙色气泡
                    setTimeout(() => {
                        // 如果你用的是 VS Code Live Server，路径可能不同，这里用相对路径
                        window.open("./agent.html", "_blank");
                    }, 800);
                }

            } catch (error) {
                hideLoading();
                if (error.message === "Rate Limited") {
                    appendMessage("ai", "您发送消息太频繁了，请稍作休息后再试（触发限流保护）。");
                } else {
                    appendMessage("ai", "网络开小差了，请稍后再试。");
                }
            } finally {
                btn.disabled = false;
            }
        }
    

        function appendMessage(role, text, meta = null) {
            const box = document.getElementById("chat-box");
            const outerWrap = document.createElement("div");
            outerWrap.className = "flex gap-3 items-start max-w-4xl mx-auto w-full"; // 限制消息最大宽度居中

            if (role === "user") {
                outerWrap.classList.add("justify-end");
                outerWrap.innerHTML = `
                    <div class="bubble-user">${escapeHtml(text)}</div>
                    <div class="w-9 h-9 shrink-0 rounded-full bg-slate-600 text-white flex items-center justify-center">
                        <i class="fa fa-user"></i>
                    </div>
                `;
            } else {
                let bubbleClass = "bubble-ai";
                if (text.includes("转接人工客服") || text.includes("人工客服")) {
                    bubbleClass = "bubble-manual";
                }
                let htmlText = escapeHtml(text).replace(/(\[KB-\w+-\d+\])/g,
                    `<span class="text-primary font-medium bg-blue-50 px-1.5 py-0.5 rounded cursor-pointer hover:bg-blue-100 kb-tag" data-kb="$1">$1</span>`
                );

                let metaHtml = "";
                if(meta){
                    metaHtml = `<div class="mt-2 text-[10px] text-gray-400 border-t border-gray-100 pt-1">模型: ${meta.model} · 耗时 ${meta.latency_ms}ms</div>`;
                }

                outerWrap.innerHTML = `
                    <div class="w-9 h-9 shrink-0 rounded-full bg-assist text-white flex items-center justify-center">
                        <i class="fa fa-robot"></i>
                    </div>
                    <div class="${bubbleClass}">
                        <div>${htmlText}</div>
                        ${metaHtml}
                    </div>
                `;
            }
            box.appendChild(outerWrap);
            box.scrollTop = box.scrollHeight;

            document.querySelectorAll(".kb-tag").forEach(tag=>{
                tag.onclick = function(){
                    openKbModal(this.dataset.kb);
                }
            })
        }

        function escapeHtml(str){
            return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        function openKbModal(kbId){
            document.getElementById("kbContent").innerText = `知识库编号 ${kbId}\n这里为知识库对应原始文档内容，后端可返回真实文本`;
            document.getElementById("kbModal").style.display = "flex";
        }
        function closeKbModal(){
            document.getElementById("kbModal").style.display = "none";
        }
        document.getElementById("kbModal").addEventListener("click", function(e){
            if(e.target === this) closeKbModal();
        })
    </script>
</body>
</html>
