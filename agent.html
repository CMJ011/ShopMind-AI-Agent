<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopMind 坐席工作台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#162D59',
                        primaryLight: '#254b99',
                        assist: '#2A9D8F',
                        warn: '#D64045',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .scrollbar-chat::-webkit-scrollbar { width:5px }
            .scrollbar-chat::-webkit-scrollbar-thumb { @apply bg-gray-300 rounded-full }
            .item-active { @apply border-primary bg-blue-50 shadow-sm }
        }
    </style>
</head>
<!-- 🔥 修改点：body 铺满全屏，去掉 padding 和 gap -->
<body class="bg-slate-100 h-screen w-screen overflow-hidden flex">

    <!-- 左侧工单列表 -->
    <div class="w-1/3 max-w-sm bg-white border-r border-gray-200 flex flex-col h-full">
        <div class="p-5 bg-gradient-to-r from-primary to-primaryLight text-white shadow-md z-10">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-full bg-white/20 flex items-center justify-center">
                    <i class="fa fa-tasks text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg">待接入工单</h1>
                    <p class="text-xs text-blue-100">实时会话队列 · 自动刷新</p>
                </div>
            </div>
        </div>
        <div id="session-list" class="flex-1 overflow-y-auto scrollbar-chat p-3 bg-slate-50">
            <!-- 列表通过 JS 渲染 -->
        </div>
    </div>

    <!-- 右侧聊天区 -->
    <div class="flex-1 bg-white flex flex-col h-full">
        <div id="chat-header" class="p-4 border-b border-gray-200 flex items-center gap-3 bg-white shadow-sm z-10">
            <div class="w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center">
                <i class="fa fa-comments-o text-slate-500"></i>
            </div>
            <div>
                <div class="font-bold text-slate-700">请从左侧选择工单接入</div>
                <div class="text-xs text-slate-400">坐席人工对话面板</div>
            </div>
        </div>

        <div id="chat-box" class="flex-1 p-6 overflow-y-auto scrollbar-chat bg-slate-50 flex flex-col gap-4">
            <!-- 聊天记录通过 JS 渲染 -->
            <div class="text-center text-gray-400 text-sm mt-10">
                <i class="fa fa-coffee text-4xl mb-3 opacity-20 block"></i>
                喝杯咖啡，等待用户发起会话吧
            </div>
        </div>

        <!-- 输入区域 -->
        <div class="p-4 border-t border-gray-200 bg-white shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-10">
            <div class="flex gap-3">
                <input type="text" id="reply-input" placeholder="输入回复内容，回车快速发送..."
                    class="flex-1 border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary/40 transition"
                    onkeypress="if(event.key === 'Enter') sendReply()">
                <button onclick="sendReply()"
                    class="bg-primary text-white px-6 py-2.5 rounded-xl text-sm hover:bg-primaryLight transition-all active:scale-95 flex items-center gap-2">
                    <i class="fa fa-paper-plane"></i>
                    <span>发送</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        let currentSessionId = null;

        async function loadSessions() {
            try {
                const res = await fetch("http://127.0.0.1:8000/api/agent/sessions");
                const sessions = await res.json();
                const list = document.getElementById("session-list");
                
                // 避免重复渲染相同的列表（简单防闪烁）
                if (list.innerHTML.includes("暂无待接入工单") && sessions.length === 0) return;
                if (list.innerHTML.includes("会话:") && sessions.length > 0) {
                    // 略过极度复杂的 diff 算法，直接重新渲染
                }
                
                list.innerHTML = "";
                if (sessions.length === 0) {
                    list.innerHTML = `
                    <div class="text-gray-400 text-center mt-16 text-sm">
                        <i class="fa fa-inbox text-3xl mb-2 block opacity-40"></i>
                        暂无待接入工单
                    </div>`;
                    return;
                }

                sessions.forEach(s => {
                    const div = document.createElement("div");
                    div.className = "p-4 mb-2 border border-transparent rounded-xl cursor-pointer hover:bg-white transition bg-gray-100";
                    if (s.session_id === currentSessionId) {
                        div.className = "p-4 mb-2 border item-active rounded-xl cursor-pointer transition bg-white";
                    }
                    div.innerHTML = `
                        <div class="flex items-start gap-3">
                            <div class="w-8 h-8 shrink-0 rounded-full bg-slate-200 text-slate-500 flex items-center justify-center">
                                <i class="fa fa-user"></i>
                            </div>
                            <div>
                                <div class="font-medium text-sm text-primary">会话: ${s.session_id}</div>
                                <div class="text-xs text-gray-500 mt-1">用户ID：${s.user_id}</div>
                            </div>
                        </div>
                    `;
                    div.onclick = () => selectSession(s.session_id);
                    list.appendChild(div);
                });
            } catch (e) {
                console.error("加载工单失败", e);
            }
        }

        async function selectSession(sessionId) {
            currentSessionId = sessionId;
            document.getElementById("chat-header").innerHTML = `
                <div class="w-9 h-9 rounded-full bg-assist text-white flex items-center justify-center">
                    <i class="fa fa-user-circle-o"></i>
                </div>
                <div>
                    <div class="font-bold text-slate-700">正在服务：${sessionId}</div>
                    <div class="text-xs text-slate-400">人工坐席介入会话</div>
                </div>
            `;
            const res = await fetch(`http://127.0.0.1:8000/api/agent/sessions/${sessionId}/messages`);
            const messages = await res.json();

            const box = document.getElementById("chat-box");
            box.innerHTML = "";
            
            if (messages.length === 0) {
                 box.innerHTML = `<div class="text-center text-gray-400 text-sm mt-10">暂无消息记录</div>`;
                 return;
            }

                       messages.forEach(m => {
                const wrap = document.createElement("div");
                wrap.className = "flex gap-3 items-start max-w-4xl mx-auto w-full";
                const bubble = document.createElement("div");

                if (m.role === "user") {
                    // 用户消息
                    wrap.innerHTML = `
                        <div class="w-9 h-9 shrink-0 rounded-full bg-slate-400 text-white flex items-center justify-center">
                            <i class="fa fa-user"></i>
                        </div>
                    `;
                    bubble.className = "bg-white border border-gray-200 p-3 rounded-xl rounded-tl-none max-w-[82%] shadow-sm text-sm";
                    bubble.innerText = m.content;
                    wrap.appendChild(bubble);
                } else {
                    wrap.classList.add("justify-end");
                    // 🔥 区分 AI 和 人工
                    let isManual = m.content.startsWith("【人工客服】");
                    
                    if (isManual) {
                        // 人工回复：主色调蓝色
                        bubble.className = "bg-gradient-to-r from-primary to-primaryLight text-white p-3 rounded-xl rounded-tr-none max-w-[82%] shadow-sm text-sm";
                    } else {
                        // AI回复：浅绿色
                        bubble.className = "bg-assist/10 border border-assist/20 text-slate-700 p-3 rounded-xl rounded-tr-none max-w-[82%] shadow-sm text-sm";
                    }
                    
                    bubble.innerText = m.content;
                    wrap.appendChild(bubble);
                    
                    // 头像区分
                    wrap.innerHTML += `
                        <div class="w-9 h-9 shrink-0 rounded-full ${isManual ? 'bg-primary' : 'bg-assist'} text-white flex items-center justify-center">
                            <i class="fa ${isManual ? 'fa-headphones' : 'fa-robot'}"></i>
                        </div>
                    `;
                }
                box.appendChild(wrap);
            });
            box.scrollTop = box.scrollHeight;
            loadSessions();
        }

        async function sendReply() {
            if (!currentSessionId) return alert("请先在左侧选择要接入的工单");
            const input = document.getElementById("reply-input");
            const content = input.value.trim();
            if (!content) return;

            await fetch(`http://127.0.0.1:8000/api/agent/sessions/${currentSessionId}/reply`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ content })
            });

            input.value = "";
            selectSession(currentSessionId);
        }

        setInterval(loadSessions, 3000);
        loadSessions();
    </script>
</body>
</html>
